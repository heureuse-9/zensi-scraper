name: Recurring Zensi Creator Analytics

on:
  workflow_dispatch:
  schedule:
    # Refresh and verify the Streamlit snapshot every 2 hours.
    - cron: "17 */2 * * *"
    # Friday reporting run. 12:47 UTC is 8:47 AM US Eastern during daylight saving time.
    - cron: "47 12 * * 5"

permissions:
  contents: write

jobs:
  refresh-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh latest Streamlit snapshot
        run: python -m zensi_scraper refresh-cache --config config.github.json --snapshot data/latest_snapshot.json --lookback-days 14

      - name: Commit latest snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_snapshot.json
          git diff --cached --quiet || git commit -m "Update Zensi analytics snapshot"
          git push

  weekly-report:
    needs: refresh-cache
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 12 * * 5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build weekly report
        run: python -m zensi_scraper run-weekly --config config.github.json

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: zensi-weekly-reports
          path: outputs/**
